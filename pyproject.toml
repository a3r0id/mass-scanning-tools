[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mass-scanning-tools"
version = "2.0.0"
description = "Map services across IP ranges: ASN -> CIDR -> ZMap -> ZGrab2 -> archive"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "A3R0" }]
keywords = ["scanning", "zmap", "zgrab2", "asn", "security", "reconnaissance"]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
mst = "mst.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mst"]
